plugins { id 'com.android.application' }

android {
    namespace 'com.tomtombridge.diagnostic'
    compileSdk 35
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'com.tomtombridge.diagnostic'
        minSdk 26
        targetSdk 35
        versionCode 11
        versionName '1.0.0-personal-beta'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
